services:
  - type: web
    name: kbn5-core
    runtime: python
    buildCommand: pip install -r requirements-render.txt
    startCommand: gunicorn app:app
    healthCheckPath: /
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: kbn5-db
          property: connectionString
      - key: SESSION_COOKIE_SECURE
        value: "true"

databases:
  - name: kbn5-db
    databaseName: kbn5
    user: kbn5_user
